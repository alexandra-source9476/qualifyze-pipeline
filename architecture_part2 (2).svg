<!-- ═══ EVENT DETECTION ═══ -->
<rect x="20" y="324" width="740" height="110" rx="7" fill="#E0F7F4" stroke="#0B8A72" stroke-width="1"/>
<text class="lh" x="36" y="341" fill="#065C4C">EVENT DETECTION — new in Part 2</text>
<text class="lt" x="36" y="354">runs after every pipeline completion · appends events · never deletes</text>

<rect x="36" y="360" width="220" height="62" rx="4" fill="#A8EDE5" stroke="#0B8A72" stroke-width="0.5"/>
<text class="bh" x="146" y="375" text-anchor="middle">Change Detection Job</text>
<text class="bt" x="146" y="389" text-anchor="middle">compares silver vs previous run</text>
<text class="bt" x="146" y="401" text-anchor="middle">inserts ncr_detected / ncr_resolved</text>
<text class="tool" x="146" y="414" text-anchor="middle">Python · Dagster op · PostgreSQL</text>

<line x1="256" y1="391" x2="276" y2="391" stroke="#0B8A72" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="276" y="360" width="220" height="62" rx="4" fill="#A8EDE5" stroke="#0B8A72" stroke-width="0.5"/>
<text class="bh" x="386" y="375" text-anchor="middle">ncr_events</text>
<text class="bt" x="386" y="389" text-anchor="middle">append-only · full history per site</text>
<text class="bt" x="386" y="401" text-anchor="middle">ncr_detected / ncr_resolved events</text>
<text class="tool" x="386" y="414" text-anchor="middle">PostgreSQL · append-only table</text>

<line x1="496" y1="391" x2="516" y2="391" stroke="#0B8A72" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="516" y="360" width="228" height="62" rx="4" fill="#A8EDE5" stroke="#0B8A72" stroke-width="0.5"/>
<text class="bh" x="630" y="375" text-anchor="middle">ncr_current_status</text>
<text class="bt" x="630" y="389" text-anchor="middle">rebuilt each run · compliance score</text>
<text class="bt" x="630" y="401" text-anchor="middle">total NCRs · avg resolution days</text>
<text class="tool" x="630" y="414" text-anchor="middle">dbt model · PostgreSQL</text>

<!-- ═══ NOTIFICATION ═══ -->
<rect x="20" y="448" width="740" height="110" rx="7" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text class="lh" x="36" y="465" fill="#854F0B">NOTIFICATION — triggered by ncr_detected and ncr_resolved events</text>
