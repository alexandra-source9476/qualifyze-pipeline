<text class="title" x="390" y="20" text-anchor="middle">NCR Monitoring System — Architecture</text>

<!-- ═══ SOURCE ═══ -->
<rect x="20" y="32" width="740" height="68" rx="7" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text class="lh" x="36" y="49" fill="#444">SOURCE</text>
<text class="lt" x="36" y="62">No API or RSS feed available · Excel export is the only programmatic access point</text>

<rect x="36" y="68" width="260" height="24" rx="4" fill="#DDD8CC" stroke="#888780" stroke-width="0.5"/>
<text class="bh" x="166" y="82" text-anchor="middle">EudraGMDP Public Site (EMA)</text>

<rect x="316" y="68" width="260" height="24" rx="4" fill="#DDD8CC" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>
<text class="bh" x="446" y="78" text-anchor="middle" fill="#777">EMA API</text>
<text class="tool" x="446" y="88" text-anchor="middle">future · if EMA introduces programmatic access</text>

<!-- ═══ INGESTION ═══ -->
<rect x="20" y="114" width="740" height="100" rx="7" fill="#F5F0FA" stroke="#8A62C6" stroke-width="1"/>
<text class="lh" x="36" y="131" fill="#5B3A9E">INGESTION</text>
<text class="lt" x="36" y="144">Scheduled every 6 hours · automated download · file storage · pipeline trigger</text>

<rect x="36" y="150" width="220" height="52" rx="4" fill="#D4C4F0" stroke="#8A62C6" stroke-width="0.5"/>
<text class="bh" x="146" y="165" text-anchor="middle">Playwright Fetch Job</text>
<text class="bt" x="146" y="179" text-anchor="middle">headless browser · submits search form</text>
<text class="tool" x="146" y="193" text-anchor="middle">Playwright · Python · Dagster scheduled op</text>

<line x1="256" y1="176" x2="276" y2="176" stroke="#8A62C6" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="276" y="150" width="220" height="52" rx="4" fill="#D4C4F0" stroke="#8A62C6" stroke-width="0.5"/>
<text class="bh" x="386" y="165" text-anchor="middle">File Storage</text>
<text class="bt" x="386" y="179" text-anchor="middle">stores downloaded Excel by date</text>
<text class="tool" x="386" y="193" text-anchor="middle">AWS S3 · triggers Dagster pipeline asset</text>

<line x1="496" y1="176" x2="516" y2="176" stroke="#8A62C6" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="516" y="150" width="228" height="52" rx="4" fill="#D4C4F0" stroke="#8A62C6" stroke-width="0.5"/>
<text class="bh" x="630" y="165" text-anchor="middle">Orchestration</text>
<text class="bt" x="630" y="179" text-anchor="middle">schedules · monitors · retries on failure</text>
<text class="tool" x="630" y="193" text-anchor="middle">Dagster · cron schedule · Dagster Cloud</text>

