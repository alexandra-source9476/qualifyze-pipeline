<rect x="276" y="608" width="220" height="62" rx="4" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
<text class="bh" x="386" y="623" text-anchor="middle">Supply Chain Propagation</text>
<text class="bt" x="386" y="637" text-anchor="middle">detects indirect NCR impact</text>
<text class="bt" x="386" y="649" text-anchor="middle">alerts downstream clients</text>
<text class="tool" x="386" y="662" text-anchor="middle">Python · site_relationships table · PostgreSQL</text>

<rect x="516" y="608" width="228" height="62" rx="4" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
<text class="bh" x="630" y="623" text-anchor="middle">Geo-Risk Detection</text>
<text class="bt" x="630" y="637" text-anchor="middle">3+ NCRs same country in 30 days</text>
<text class="bt" x="630" y="649" text-anchor="middle">internal Q team alert only</text>
<text class="tool" x="630" y="662" text-anchor="middle">dbt model / SQL · Dagster schedule · AWS SES</text>

