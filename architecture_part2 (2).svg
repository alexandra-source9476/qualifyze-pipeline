<text class="bt" x="120" y="525" text-anchor="middle">monitoring dashboard</text>
<text class="tool" x="120" y="538" text-anchor="middle">AWS SES · Datadog · Grafana</text>

<rect x="218" y="484" width="168" height="62" rx="4" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text class="bh" x="302" y="499" text-anchor="middle">Client Notification</text>
<text class="bt" x="302" y="513" text-anchor="middle">email per affected client</text>
<text class="bt" x="302" y="525" text-anchor="middle">push to mobile app</text>
<text class="tool" x="302" y="538" text-anchor="middle">AWS SES · Firebase FCM</text>

<rect x="400" y="484" width="168" height="62" rx="4" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text class="bh" x="484" y="499" text-anchor="middle">Rotation Task</text>
<text class="bt" x="484" y="513" text-anchor="middle">auto-created on NCR event</text>
<text class="bt" x="484" y="525" text-anchor="middle">assigned to on-call person</text>
<text class="tool" x="484" y="538" text-anchor="middle">Jira API · Asana API · Python</text>

<rect x="582" y="484" width="162" height="62" rx="4" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text class="bh" x="663" y="499" text-anchor="middle">ncr_notifications</text>
<text class="bt" x="663" y="513" text-anchor="middle">logs all alerts sent</text>
<text class="bt" x="663" y="525" text-anchor="middle">SLA gap tracking</text>
<text class="tool" x="663" y="538" text-anchor="middle">PostgreSQL · append-only</text>

