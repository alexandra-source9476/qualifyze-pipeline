name: qualifyze_pipeline
version: '1.0.0'
config-version: 2

profile: qualifyze

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  batch_id: "manual-run"

models:
  qualifyze_pipeline:
    bronze:
      +materialized: incremental
    silver:
      +materialized: table
    gold:
      +materialized: table

seeds:
  qualifyze_pipeline:
    +quote_columns: false
