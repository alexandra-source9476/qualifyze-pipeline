<svg xmlns="http://www.w3.org/2000/svg" width="780" viewBox="0 0 780 1020">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  text { font-family: Arial, sans-serif; fill: #1a1a1a; }
  .title { font-size: 14px; font-weight: 700; }
  .bh { font-size: 11px; font-weight: 700; }
  .bt { font-size: 10px; fill: #333; }
  .lbl { font-size: 9px; fill: #666; }
</style>

<text class="title" x="390" y="22" text-anchor="middle">Part 1 Pipeline — Execution Flow</text>

<!-- COLOR KEY -->
<rect x="20" y="32" width="740" height="20" rx="4" fill="#F8F8F8" stroke="#ddd" stroke-width="0.5"/>
<rect x="30" y="37" width="10" height="10" rx="2" fill="#D4C4F0" stroke="#8A62C6" stroke-width="0.5"/>
<text x="44" y="46" font-size="9" fill="#444">Python / Ingestion</text>
<rect x="150" y="37" width="10" height="10" rx="2" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="164" y="46" font-size="9" fill="#444">Bronze (dbt)</text>
<rect x="250" y="37" width="10" height="10" rx="2" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
<text x="264" y="46" font-size="9" fill="#444">Silver (dbt)</text>
<rect x="340" y="37" width="10" height="10" rx="2" fill="#C8C4F5" stroke="#534AB7" stroke-width="0.5"/>
<text x="354" y="46" font-size="9" fill="#444">Matching (Python)</text>
<rect x="460" y="37" width="10" height="10" rx="2" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="474" y="46" font-size="9" fill="#444">Gold (dbt)</text>
<rect x="540" y="37" width="10" height="10" rx="2" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.5"/>
<text x="554" y="46" font-size="9" fill="#444">Rejected</text>

<!-- ══ STEP 1 ══ -->
<rect x="190" y="62" width="400" height="52" rx="6" fill="#D4C4F0" stroke="#8A62C6" stroke-width="1"/>
<circle cx="214" cy="88" r="12" fill="#8A62C6"/>
<text x="214" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="white">1</text>
<text class="bh" x="420" y="80" text-anchor="middle">Python: generate ingestion_batch_id</text>
<text class="bt" x="420" y="96" text-anchor="middle">uuid.uuid4() · unique per run · passed to dbt as --vars</text>

<line x1="390" y1="114" x2="390" y2="130" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ STEP 2 ══ -->
<rect x="190" y="130" width="400" height="52" rx="6" fill="#D4C4F0" stroke="#8A62C6" stroke-width="1"/>
<circle cx="214" cy="156" r="12" fill="#8A62C6"/>
<text x="214" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="white">2</text>
<text class="bh" x="420" y="148" text-anchor="middle">Python: read Excel → append to raw_eudragmdp</text>
<text class="bt" x="420" y="164" text-anchor="middle">header at row 5 · all columns as TEXT · +batch_id · +source · append-only</text>

<line x1="390" y1="182" x2="390" y2="198" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
<text class="lbl" x="510" y="193">dbt run --vars batch_id source</text>

<!-- ══ STEP 3 ══ -->
<rect x="190" y="198" width="400" height="52" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>
<circle cx="214" cy="224" r="12" fill="#1D9E75"/>
<text x="214" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="white">3</text>
<text class="bh" x="420" y="216" text-anchor="middle">dbt: bronze_eudragmdp — filter · cast · validate</text>
<text class="bt" x="420" y="232" text-anchor="middle">filter raw by batch_id + source · cast dates · check required fields</text>

<!-- fork from bronze -->
<line x1="310" y1="250" x2="200" y2="278" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arr-g)"/>
<text class="lbl" x="234" y="268" fill="#1D9E75">valid</text>
<line x1="470" y1="250" x2="580" y2="278" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arr-r)"/>
<text class="lbl" x="536" y="268" fill="#D85A30">invalid</text>

<!-- bronze boxes -->
<rect x="60" y="278" width="280" height="44" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>
<text class="bh" x="200" y="296" text-anchor="middle">→ bronze_eudragmdp</text>
<text class="bt" x="200" y="312" text-anchor="middle">cast types · +ingested_at · +batch_id · append-only</text>

<rect x="440" y="278" width="280" height="44" rx="6" fill="#F5C4B3" stroke="#D85A30" stroke-width="1"/>
<text class="bh" x="580" y="296" text-anchor="middle">→ bronze_rejected</text>
<text class="bt" x="580" y="312" text-anchor="middle">rejection_reason · +batch_id · append-only</text>

<!-- TWO arrows from bronze_eudragmdp to both silvers -->
<line x1="140" y1="322" x2="110" y2="352" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="260" y1="322" x2="290" y2="352" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
<text class="lbl" x="200" y="342">reads ALL bronze history</text>

<!-- ══ SILVER — two side by side ══ -->
<rect x="20" y="352" width="220" height="60" rx="6" fill="#B5D4F4" stroke="#378ADD" stroke-width="1"/>
<circle cx="44" cy="370" r="12" fill="#378ADD"/>
<text x="44" y="374" text-anchor="middle" font-size="10" font-weight="700" fill="white">4</text>
<text class="bh" x="130" y="370" text-anchor="middle">dbt: silver_eudragmdp_sites</text>
<text class="bt" x="130" y="386" text-anchor="middle">deduplicate on oms_location_id</text>
<text class="bt" x="130" y="400" text-anchor="middle">max last_updated_date · one row per site</text>

<rect x="260" y="352" width="220" height="60" rx="6" fill="#B5D4F4" stroke="#378ADD" stroke-width="1"/>
<circle cx="284" cy="370" r="12" fill="#378ADD"/>
<text x="284" y="374" text-anchor="middle" font-size="10" font-weight="700" fill="white">5</text>
<text class="bh" x="370" y="370" text-anchor="middle">dbt: silver_compliance_documents</text>
<text class="bt" x="370" y="386" text-anchor="middle">deduplicate on eudragmdp_doc_ref</text>
<text class="bt" x="370" y="400" text-anchor="middle">max last_updated_date · all doc types</text>

<!-- MATCHING arrow from silver_sites -->
<line x1="130" y1="412" x2="130" y2="432" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ STEP 6 MATCHING ══ -->
<rect x="20" y="432" width="220" height="68" rx="6" fill="#C8C4F5" stroke="#534AB7" stroke-width="1"/>
<circle cx="44" cy="450" r="12" fill="#534AB7"/>
<text x="44" y="454" text-anchor="middle" font-size="10" font-weight="700" fill="white">6</text>
<text class="bh" x="130" y="450" text-anchor="middle">Python: matching</text>
<text class="bt" x="130" y="466" text-anchor="middle">Pass 1: exact on oms_location_id</text>
<text class="bt" x="130" y="482" text-anchor="middle">Pass 2: fuzzy site_name + country</text>
<text class="bt" x="130" y="496" text-anchor="middle">updates qualifyze_site_id in silver</text>

<!-- arrows from both silvers and matching to gold -->
<line x1="130" y1="500" x2="130" y2="528" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="370" y1="412" x2="370" y2="528" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- ══ GOLD — two side by side ══ -->
<rect x="20" y="528" width="220" height="60" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
<circle cx="44" cy="546" r="12" fill="#BA7517"/>
<text x="44" y="550" text-anchor="middle" font-size="10" font-weight="700" fill="white">7</text>
<text class="bh" x="130" y="546" text-anchor="middle">dbt: gold_site_compliance_view</text>
<text class="bt" x="130" y="562" text-anchor="middle">master_site → silver_sites → compliance_docs</text>
<text class="bt" x="130" y="576" text-anchor="middle">filter by ref_accepted_document_types</text>

<rect x="260" y="528" width="220" height="60" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
<circle cx="284" cy="546" r="12" fill="#BA7517"/>
<text x="284" y="550" text-anchor="middle" font-size="10" font-weight="700" fill="white">8</text>
<text class="bh" x="370" y="546" text-anchor="middle">dbt: gold_ncr_alerts</text>
<text class="bt" x="370" y="562" text-anchor="middle">incremental · new GMP NC docs</text>
<text class="bt" x="370" y="576" text-anchor="middle">not seen before → insert</text>

<!-- fork from gold_ncr_alerts -->
<line x1="320" y1="588" x2="290" y2="616" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arr-r)"/>
<text class="lbl" x="278" y="606" text-anchor="end" fill="#D85A30">new NCR</text>
<line x1="420" y1="588" x2="450" y2="616" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arr-g)"/>
<text class="lbl" x="462" y="606" fill="#1D9E75">already known</text>

<rect x="180" y="616" width="220" height="44" rx="6" fill="#F5C4B3" stroke="#D85A30" stroke-width="1"/>
<text class="bh" x="290" y="634" text-anchor="middle" fill="#4A1B0C">insert gold_ncr_alerts</text>
<text class="bt" x="290" y="650" text-anchor="middle" fill="#993C1D">status: pending · detected_at: now()</text>

<rect x="420" y="616" width="220" height="44" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text class="bh" x="530" y="634" text-anchor="middle" fill="#085041">no action</text>
<text class="bt" x="530" y="650" text-anchor="middle" fill="#0F6E56">already in gold_ncr_alerts</text>

<!-- ══ NOTES — moved below everything ══ -->
<rect x="20" y="680" width="360" height="120" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8" stroke-dasharray="4 2"/>
<text x="200" y="698" text-anchor="middle" font-size="10" font-weight="700" fill="#501313">Hard stop — infrastructure errors only:</text>
<text x="36" y="716" font-size="9.5" fill="#A32D2D">· Source file missing from data/raw/</text>
<text x="36" y="732" font-size="9.5" fill="#A32D2D">· File structure changed (missing expected columns)</text>
<text x="36" y="748" font-size="9.5" fill="#A32D2D">· Database inaccessible</text>
<line x1="36" y1="758" x2="364" y2="758" stroke="#A32D2D" stroke-width="0.5"/>
<text x="200" y="774" text-anchor="middle" font-size="10" font-weight="700" fill="#701010">Data anomalies never stop pipeline:</text>
<text x="36" y="790" font-size="9.5" fill="#A32D2D">· Invalid rows → bronze_rejected · pipeline continues</text>

<rect x="400" y="680" width="360" height="120" rx="6" fill="#F0F8FF" stroke="#378ADD" stroke-width="0.8" stroke-dasharray="4 2"/>
<text x="580" y="698" text-anchor="middle" font-size="10" font-weight="700" fill="#185FA5">If downstream fails — reprocess:</text>
<text x="416" y="716" font-size="9.5" fill="#378ADD">· bronze failed → rerun from raw using same batch_id</text>
<text x="416" y="732" font-size="9.5" fill="#378ADD">  no re-fetch from EudraGMDP needed</text>
<text x="416" y="748" font-size="9.5" fill="#378ADD">· silver/gold failed → rerun dbt only</text>
<text x="416" y="764" font-size="9.5" fill="#378ADD">  raw + bronze remain unchanged</text>
<text x="416" y="780" font-size="9.5" fill="#378ADD">· raw is append-only → source of truth always preserved</text>
</svg>
