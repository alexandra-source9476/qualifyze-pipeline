</style>

<text class="title" x="390" y="22" text-anchor="middle">NCR Monitoring System — Interaction Flow</text>

<!-- COLOR KEY -->
<rect x="20" y="32" width="740" height="22" rx="4" fill="#F8F8F8" stroke="#ddd" stroke-width="0.5"/>
<rect x="30" y="38" width="10" height="10" rx="2" fill="#D4C4F0" stroke="#8A62C6" stroke-width="0.5"/>
<text x="44" y="47" font-size="9" fill="#444">Ingestion</text>
<rect x="110" y="38" width="10" height="10" rx="2" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="124" y="47" font-size="9" fill="#444">Pipeline (Part 1)</text>
<rect x="220" y="38" width="10" height="10" rx="2" fill="#A8EDE5" stroke="#0B8A72" stroke-width="0.5"/>
<text x="234" y="47" font-size="9" fill="#444">Event Detection</text>
<rect x="340" y="38" width="10" height="10" rx="2" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="354" y="47" font-size="9" fill="#444">Notification</text>
<rect x="440" y="38" width="10" height="10" rx="2" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
<text x="454" y="47" font-size="9" fill="#444">Intelligence</text>
<rect x="530" y="38" width="10" height="10" rx="2" fill="#C8C4F5" stroke="#3D4DB5" stroke-width="0.5"/>
<text x="544" y="47" font-size="9" fill="#444">Client Platform</text>

<!-- ══════════════════════════════════════════════════════ -->
<!-- FLOW A: NCR DETECTED -->
<!-- ══════════════════════════════════════════════════════ -->
<rect x="20" y="62" width="740" height="14" rx="3" fill="#D85A30" opacity="0.2"/>
<text x="390" y="73" text-anchor="middle" font-size="10" font-weight="700" fill="#8B2A0A">FLOW A — New NCR detected on EudraGMDP</text>

<!-- Row 1: trigger -->
<rect x="20" y="82" width="356" height="44" rx="5" fill="#D4C4F0" stroke="#8A62C6" stroke-width="1"/>
<circle cx="38" cy="104" r="9" fill="#8A62C6"/>
<text class="step" x="38" y="108">1</text>
<text class="bh" x="200" y="98" text-anchor="middle">Dagster triggers Playwright every 6 hours</text>
<text class="bt" x="200" y="114" text-anchor="middle">headless browser downloads Excel from EudraGMDP · saves to S3</text>

<line x1="376" y1="104" x2="404" y2="104" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="404" y="82" width="356" height="44" rx="5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>
<circle cx="422" cy="104" r="9" fill="#1D9E75"/>
<text class="step" x="422" y="108">2</text>
<text class="bh" x="582" y="98" text-anchor="middle">Part 1 pipeline runs (unchanged)</text>
<text class="bt" x="582" y="114" text-anchor="middle">raw → bronze → silver → gold_site_compliance_view rebuilt</text>

<!-- arrow down -->
<line x1="390" y1="126" x2="390" y2="140" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- Row 2: detection -->
<rect x="20" y="140" width="356" height="44" rx="5" fill="#A8EDE5" stroke="#0B8A72" stroke-width="1"/>
<circle cx="38" cy="162" r="9" fill="#0B8A72"/>
<text class="step" x="38" y="166">3</text>
<text class="bh" x="200" y="156" text-anchor="middle">Change detection job runs</text>
<text class="bt" x="200" y="172" text-anchor="middle">compares current silver vs previous run · finds new GMPNC</text>

<line x1="376" y1="162" x2="404" y2="162" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="404" y="140" width="356" height="44" rx="5" fill="#A8EDE5" stroke="#0B8A72" stroke-width="1"/>
<circle cx="422" cy="162" r="9" fill="#0B8A72"/>
<text class="step" x="422" y="166">4</text>
<text class="bh" x="582" y="156" text-anchor="middle">ncr_detected event inserted</text>
<text class="bt" x="582" y="172" text-anchor="middle">ncr_events append-only · ncr_current_status rebuilt</text>

<line x1="390" y1="184" x2="390" y2="198" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- Row 3: notification -->
<rect x="20" y="198" width="356" height="44" rx="5" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
<circle cx="38" cy="220" r="9" fill="#BA7517"/>
<text class="step" x="38" y="224">5</text>
<text class="bh" x="200" y="214" text-anchor="middle">Internal team notified first</text>
<text class="bt" x="200" y="230" text-anchor="middle">email to Q team (AWS SES) · alert on Datadog/Grafana dashboard</text>

<line x1="376" y1="220" x2="404" y2="220" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="404" y="198" width="356" height="44" rx="5" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
<circle cx="422" cy="220" r="9" fill="#BA7517"/>
<text class="step" x="422" y="224">6</text>
<text class="bh" x="582" y="214" text-anchor="middle">Affected clients notified</text>
<text class="bt" x="582" y="230" text-anchor="middle">email per client (AWS SES) · push notification (Firebase)</text>

<line x1="390" y1="242" x2="390" y2="256" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- Row 4: task + intelligence -->
<rect x="20" y="256" width="356" height="44" rx="5" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
<circle cx="38" cy="278" r="9" fill="#BA7517"/>
<text class="step" x="38" y="282">7</text>
<text class="bh" x="200" y="272" text-anchor="middle">Task auto-created for rotation person</text>
<text class="bt" x="200" y="288" text-anchor="middle">Jira/Asana · owns follow-up · reviews recommendations</text>

<line x1="376" y1="278" x2="404" y2="278" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="404" y="256" width="356" height="44" rx="5" fill="#B5D4F4" stroke="#378ADD" stroke-width="1"/>
<circle cx="422" cy="278" r="9" fill="#378ADD"/>
<text class="step" x="422" y="282">8</text>
<text class="bh" x="582" y="272" text-anchor="middle">Recommendation engine runs</text>
<text class="bt" x="582" y="288" text-anchor="middle">finds alternatives · active GMPC · no NCR last 12 months</text>

<line x1="390" y1="300" x2="390" y2="314" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- Row 5: supply chain + platform -->
<rect x="20" y="314" width="356" height="44" rx="5" fill="#B5D4F4" stroke="#378ADD" stroke-width="1"/>
<circle cx="38" cy="336" r="9" fill="#378ADD"/>
<text class="step" x="38" y="340">9</text>
<text class="bh" x="200" y="330" text-anchor="middle">Supply chain propagation check</text>
<text class="bt" x="200" y="346" text-anchor="middle">if indirect impact detected → additional alert to downstream clients</text>

<line x1="376" y1="336" x2="404" y2="336" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="404" y="314" width="356" height="44" rx="5" fill="#C8C4F5" stroke="#3D4DB5" stroke-width="1"/>
<circle cx="422" cy="336" r="9" fill="#3D4DB5"/>
<text class="step" x="422" y="340">10</text>
<text class="bh" x="582" y="330" text-anchor="middle">Platform updated</text>
<text class="bt" x="582" y="346" text-anchor="middle">client dashboard shows alert · recommendations · compliance history</text>

<!-- ══════════════════════════════════════════════════════ -->
<!-- FLOW B: NCR RESOLVED -->
<!-- ══════════════════════════════════════════════════════ -->
<rect x="20" y="374" width="740" height="14" rx="3" fill="#1D9E75" opacity="0.2"/>
<text x="390" y="385" text-anchor="middle" font-size="10" font-weight="700" fill="#0A5A3C">FLOW B — NCR resolved · site returns to compliance</text>

<!-- Row 1 -->
<rect x="20" y="394" width="356" height="44" rx="5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>
<circle cx="38" cy="416" r="9" fill="#1D9E75"/>
<text class="step" x="38" y="420">1</text>
<text class="bh" x="200" y="410" text-anchor="middle">Next polling run: resolution detected</text>
<text class="bt" x="200" y="426" text-anchor="middle">GMPNC absent from export OR new GMPC issued for same site</text>

<line x1="376" y1="416" x2="404" y2="416" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="404" y="394" width="356" height="44" rx="5" fill="#A8EDE5" stroke="#0B8A72" stroke-width="1"/>
<circle cx="422" cy="416" r="9" fill="#0B8A72"/>
<text class="step" x="422" y="420">2</text>
<text class="bh" x="582" y="410" text-anchor="middle">ncr_resolved event inserted</text>
<text class="bt" x="582" y="426" text-anchor="middle">ncr_events · ncr_current_status updated · is_reissued calculated</text>

<line x1="390" y1="438" x2="390" y2="452" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- Row 2 -->
<rect x="20" y="452" width="356" height="44" rx="5" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
<circle cx="38" cy="474" r="9" fill="#BA7517"/>
<text class="step" x="38" y="478">3</text>
<text class="bh" x="200" y="468" text-anchor="middle">Resolution notification sent</text>
<text class="bt" x="200" y="484" text-anchor="middle">Q team + affected clients informed · supplier returned to compliance</text>

<line x1="376" y1="474" x2="404" y2="474" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="404" y="452" width="356" height="44" rx="5" fill="#C8C4F5" stroke="#3D4DB5" stroke-width="1"/>
<circle cx="422" cy="474" r="9" fill="#3D4DB5"/>
<text class="step" x="422" y="478">4</text>
<text class="bh" x="582" y="468" text-anchor="middle">Client decides on reinstatement</text>
<text class="bt" x="582" y="484" text-anchor="middle">grace period applies (default 12 months) · supplier re-enters pool when eligible</text>

<!-- ══════════════════════════════════════════════════════ -->
<!-- FLOW C: GEO RISK -->
<!-- ══════════════════════════════════════════════════════ -->
<rect x="20" y="512" width="740" height="14" rx="3" fill="#534AB7" opacity="0.2"/>
<text x="390" y="523" text-anchor="middle" font-size="10" font-weight="700" fill="#26215C">FLOW C — Geo-risk pattern detected · internal alert only</text>

<rect x="20" y="532" width="356" height="44" rx="5" fill="#A8EDE5" stroke="#0B8A72" stroke-width="1"/>
<circle cx="38" cy="554" r="9" fill="#0B8A72"/>
<text class="step" x="38" y="558">1</text>
<text class="bh" x="200" y="548" text-anchor="middle">Scheduled query on ncr_events</text>
<text class="bt" x="200" y="564" text-anchor="middle">3 or more NCRs from same country detected within 30 days</text>

<line x1="376" y1="554" x2="404" y2="554" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

<rect x="404" y="532" width="356" height="44" rx="5" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
<circle cx="422" cy="554" r="9" fill="#BA7517"/>
<text class="step" x="422" y="558">2</text>
<text class="bh" x="582" y="548" text-anchor="middle">Internal alert to Q team only</text>
<text class="bt" x="582" y="564" text-anchor="middle">clients not notified · Q team investigates before any client communication</text>

<!-- KEY DECISIONS NOTE -->
<rect x="20" y="592" width="740" height="72" rx="5" fill="#F8F8F8" stroke="#ccc" stroke-width="0.8"/>
<text x="38" y="610" font-size="10" font-weight="700" fill="#333">Key design principles visible in this flow:</text>
<text x="38" y="628" font-size="9.5" fill="#555">· Q team is always notified before clients — no client alert without internal visibility first (steps A5→A6)</text>
<text x="38" y="644" font-size="9.5" fill="#555">· ncr_events is written before notifications are sent — if notification fails, the event record is preserved (steps A4→A5)</text>
<text x="38" y="660" font-size="9.5" fill="#555">· Geo-risk stays internal — regional patterns need Q team validation before becoming client-facing (Flow C)</text>
</svg>
